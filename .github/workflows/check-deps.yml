name: Check dependencies
on:
  push:
    # paths:
    #   - '**.go'
    branches:
      - main
      - release-*
  pull_request:
    # paths:
    #   - '**.go'
    branches:
      - main
      - release-*

permissions:
  contents: read

jobs:
  check-deps:
    name: "Check dependencies"
    runs-on: ubuntu-latest-4core
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.3.1
        with:
          egress-policy: audit
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go.mod
        shell: bash
        run: |
          # there should be no go.mod changes
          go mod tidy
          git diff --exit-code
