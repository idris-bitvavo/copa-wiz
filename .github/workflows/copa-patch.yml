name: "Copa Patch"
on:
  pull_request: {}

permissions:
  contents: read

jobs:
  copa-patch:
    name: "Copa Patch"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Copacetic (copa)
        run: |
          COPA_VERSION=$(curl -s https://api.github.com/repos/project-copacetic/copacetic/releases/latest | grep tag_name | cut -d '"' -f 4)
          curl -Lo copa.tar.gz https://github.com/project-copacetic/copacetic/releases/download/${COPA_VERSION}/copa_${COPA_VERSION#v}_linux_amd64.tar.gz
          tar -xzf copa.tar.gz
          sudo mv copa /usr/local/bin/copa
          copa -v
      - name: Build copa-wiz
        run: |
          make
          export PATH="$PATH:$(pwd)/dist/$(go env GOOS)_$(go env GOARCH)/release"
          copa-wiz testdata/wiz_minimal.json | jq .
          docker pull nginx:1.21.6
          copa patch -r testdata/nginx-wiz-report.json -i nginx:1.21.6 --scanner wiz
          cat testdata/nginx-wiz-report.json | jq .
      - name: Patch test image with copa-wiz plugin
        run: |
          copa patch -r testdata/nginx-wiz-report.json -i nginx:1.21.6 --scanner wiz